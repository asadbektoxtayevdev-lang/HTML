<!DOCTYPE html>
<html>
    <head>
        <title>
        Log in
    </title>
    </head>
    <body>
       <form>
        <input autocomplete="off" autofocus name="Login:" pattern="[A-Za-z0-9]+" placeholder="login" type="login">
        <p><input autocomplete="off" autofocus name="Parol:" pattern="(?=.*[A-Z])(?=.*[a-z])(?=.*[0-9]).{8,}" placeholder="password" type="text"></p>      
        <p><input autocomplete="off" autofocus name="Email:" placeholder="Email" type="email"></p>  
        <button>Enter</button>
       </form>
    </body>
</html>
